<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Heart</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: #000000;
      overflow: hidden;
      touch-action: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #000000;
    }
    .back {
      position: fixed;
      top: 14px;
      left: 14px;
      color: #555;
      text-decoration: none;
      font-size: 14px;
      z-index: 10;
    }
    .controls {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
    }
    button {
      background: #000;
      border: 1px solid #333;
      color: #bbb;
      padding: 11px 24px;
      border-radius: 10px;
      font-size: 14px;
      min-width: 170px;
    }
  </style>
</head>
<body>
  <a href="index.html" class="back">← меню</a>
  <canvas id="canvas"></canvas>

  <div class="controls">
    <button id="playBtn">▶ Запустить</button>
  </div>

  <audio id="audio" src="white_tee.mp3" loop preload="auto" crossorigin="anonymous"></audio>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const audio = document.getElementById('audio');
    const playBtn = document.getElementById('playBtn');

    let particles = [];
    let isPlaying = false;
    let audioCtx, analyser, dataArray;
    let lastBass = 0;

    const colors = ['#ff4d8d', '#ff6b9d', '#ff8fb8', '#e91e8c', '#ff5e9c', '#ff79b0'];

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = window.innerWidth * dpr;
      canvas.height = window.innerHeight * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resize();
    window.addEventListener('resize', resize);

    function heart(a, scale) {
      const x = 16 * Math.pow(Math.sin(a), 3) * scale;
      const y = (13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a)) * scale;
      return { x, y: -y };
    }

    function spawnBurst(intensity = 1) {
      const baseScale = Math.min(window.innerWidth, window.innerHeight) / 58;
      const count = Math.floor(70 * intensity + Math.random() * 40 * intensity);

      for (let i = 0; i < count; i++) {
        const a = Math.random() * Math.PI * 2;
        const sc = (0.55 + Math.random() * 11) * (baseScale / 12);
        const pos = heart(a, sc);
        const spread = (Math.random() - 0.5) * 2.8;

        particles.push({
          x: pos.x + spread,
          y: pos.y + spread,
          size: 0.5 + Math.random() * 1.05,
          color: colors[Math.floor(Math.random() * colors.length)],
          life: 1,
          decay: 0.0048 + Math.random() * 0.006,
          vx: (Math.random() - 0.5) * 0.35 * intensity,
          vy: (Math.random() - 0.5) * 0.35 * intensity
        });
      }
    }

    function getBassEnergy() {
      if (!analyser) return 0;
      analyser.getByteFrequencyData(dataArray);

      // Берём только самые низкие частоты (бас / кик)
      let sum = 0;
      const bassBins = 8; // низкие частоты
      for (let i = 0; i < bassBins; i++) {
        sum += dataArray[i];
      }
      return sum / bassBins / 255; // от 0 до 1
    }

    function draw() {
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

      const cx = window.innerWidth / 2;
      const cy = window.innerHeight / 2 - 15;

      if (isPlaying && analyser) {
        const bass = getBassEnergy();

        // Реагируем на резкий рост баса (удар)
        if (bass > 0.42 && bass - lastBass > 0.08) {
          // Сильный удар баса → большой выброс
          const intensity = 1.2 + bass * 2.2;
          spawnBurst(intensity);
        } 
        // Средний уровень баса → небольшие точки
        else if (bass > 0.28 && Math.random() < 0.35) {
          spawnBurst(0.45 + bass);
        }

        lastBass = bass;
      }

      // Рисуем частицы
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.life -= p.decay;
        p.x += p.vx;
        p.y += p.vy;
        p.vx *= 0.98;
        p.vy *= 0.98;

        if (p.life <= 0) {
          particles.splice(i, 1);
          continue;
        }

        ctx.beginPath();
        ctx.arc(cx + p.x, cy + p.y, p.size * p.life, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life * 0.9;
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      if (particles.length > 4200) {
        particles.splice(0, particles.length - 4200);
      }

      requestAnimationFrame(draw);
    }

    async function initAudio() {
      if (audioCtx) return;

      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const source = audioCtx.createMediaElementSource(audio);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 256;
      dataArray = new Uint8Array(analyser.frequencyBinCount);

      source.connect(analyser);
      analyser.connect(audioCtx.destination);
    }

    playBtn.addEventListener('click', async () => {
      if (!isPlaying) {
        try {
          await initAudio();
          if (audioCtx.state === 'suspended') {
            await audioCtx.resume();
          }
          await audio.play();
          isPlaying = true;
          particles = [];
          playBtn.textContent = '⏸ Пауза';
        } catch (e) {
          alert('Не удалось запустить аудио');
          console.error(e);
        }
      } else {
        audio.pause();
        isPlaying = false;
        playBtn.textContent = '▶ Запустить';
      }
    });

    requestAnimationFrame(draw);
  </script>
</body>
</html>
