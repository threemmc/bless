<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Heart</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      touch-action: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #000;
    }
    .back {
      position: fixed;
      top: 14px;
      left: 14px;
      color: #555;
      text-decoration: none;
      font-size: 14px;
      z-index: 10;
    }
    .controls {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
    }
    button {
      background: #000;
      border: 1px solid #333;
      color: #bbb;
      padding: 11px 24px;
      border-radius: 10px;
      font-size: 14px;
      min-width: 170px;
    }
  </style>
</head>
<body>
<a href="index.html" class="back">← меню</a>
<canvas id="canvas"></canvas>
<div class="controls">
  <button id="playBtn">▶ Запустить</button>
</div>
<audio
  id="audio"
  src="white_tee.mp3"
  loop
  preload="auto"
  crossorigin="anonymous">
</audio>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const audio = document.getElementById('audio');
const playBtn = document.getElementById('playBtn');
let audioCtx;
let analyser;
let dataArray;
let particles = [];
let isPlaying = false;
let prevBass = 0;
let prevKick = 0;
let kickPulse = 0;
let bassPulse = 0;
let lastKickTime = 0;
/* =========================
   COLORS
========================= */
const colors = [
  '#ff4d8d',
  '#ff6b9d',
  '#ff8fb8',
  '#e91e8c',
  '#ff5e9c'
];
/* =========================
   RESIZE
========================= */
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = window.innerWidth * dpr;
  canvas.height = window.innerHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resize();
window.addEventListener('resize', resize);
/* =========================
   HEART EQUATION
========================= */
function heart(a, scale) {
  const x =
    16 *
    Math.pow(Math.sin(a), 3) *
    scale;
  const y =
    (
      13 * Math.cos(a) -
      5 * Math.cos(2 * a) -
      2 * Math.cos(3 * a) -
      Math.cos(4 * a)
    ) * scale;
  return {
    x,
    y: -y
  };
}
/* =========================
   PARTICLES
========================= */
function createParticle() {
  const base =
    Math.min(
      window.innerWidth,
      window.innerHeight
    ) / 55;
  const a =
    Math.random() *
    Math.PI *
    2;
  const sc =
    (0.6 + Math.random() * 10.5) *
    (base / 12);
  const pos =
    heart(a, sc);
  return {
    tx: pos.x,
    ty: pos.y,
    x: pos.x,
    y: pos.y,
    size:
      0.55 +
      Math.random() * 1.1,
    color:
      colors[
        Math.floor(
          Math.random() *
          colors.length
        )
      ],
    life: 1,
    decay:
      0.0025 +
      Math.random() * 0.0035,
    vx: 0,
    vy: 0
  };
}
function initHeart() {
  particles = [];
  for (let i = 0; i < 780; i++) {
    particles.push(
      createParticle()
    );
  }
}
/* =========================
   FFT
========================= */
function getFrequencyRange(minHz, maxHz) {
  if (!analyser) return 0;
  analyser.getByteFrequencyData(dataArray);
  const nyquist =
    audioCtx.sampleRate / 2;
  const minIndex =
    Math.floor(
      minHz / nyquist *
      dataArray.length
    );
  const maxIndex =
    Math.min(
      dataArray.length - 1,
      Math.ceil(
        maxHz / nyquist *
        dataArray.length
      )
    );
  let sum = 0;
  let count = 0;
  for (
    let i = minIndex;
    i <= maxIndex;
    i++
  ) {
    sum += dataArray[i];
    count++;
  }
  if (!count) return 0;
  return sum / count / 255;
}
/* =========================
   AUDIO BANDS
========================= */
function updateAudio() {
  if (!analyser) return;
  /*
     Реальные частотные диапазоны
  */
  const subBass =
    getFrequencyRange(20, 60);
  const bass =
    getFrequencyRange(60, 150);
  const lowMid =
    getFrequencyRange(150, 500);
  const mid =
    getFrequencyRange(500, 2000);
  const highMid =
    getFrequencyRange(2000, 8000);
  const high =
    getFrequencyRange(8000, 16000);
  /*
     Общий бас.
  */
  const bassEnergy =
    subBass * 0.65 +
    bass * 0.35;
  /*
     Скорость изменения баса.
     Именно это помогает отличить
     удар от просто постоянного баса.
  */
  const kickDelta =
    bassEnergy - prevBass;
  /*
     Детектор кика.
  */
  const now =
    performance.now();
  const isKick =
    bassEnergy > 0.25 &&
    kickDelta > 0.045 &&
    now - lastKickTime > 120;
  if (isKick) {
    /*
       Сильный удар.
    */
    kickPulse = 1;
    lastKickTime = now;
  }
  /*
     Плавная реакция на бас.
  */
  bassPulse =
    bassPulse * 0.78 +
    bassEnergy * 0.22;
  /*
     Затухание удара.
  */
  kickPulse *= 0.86;
  prevBass =
    bassEnergy;
  return {
    subBass,
    bass,
    lowMid,
    mid,
    highMid,
    high,
    bassEnergy
  };
}
/* =========================
   DRAW EQUALIZER
========================= */
function drawEqualizer(audioData) {
  if (!audioData) return;
  const {
    subBass,
    bass,
    lowMid,
    mid,
    highMid,
    high
  } = audioData;
  /*
     6 полос эквалайзера.
  */
  const values = [
    subBass,
    bass,
    lowMid,
    mid,
    highMid,
    high
  ];
  const width =
    window.innerWidth;
  const height =
    window.innerHeight;
  const barWidth =
    Math.min(42, width / 12);
  const gap =
    Math.max(5, barWidth * 0.28);
  const totalWidth =
    values.length * barWidth +
    (values.length - 1) * gap;
  const startX =
    (width - totalWidth) / 2;
  const bottom =
    height - 20;
  ctx.save();
  for (
    let i = 0;
    i < values.length;
    i++
  ) {
    const value =
      Math.min(
        1,
        values[i] * 1.8
      );
    const maxHeight =
      65;
    const barHeight =
      value * maxHeight;
    const x =
      startX +
      i * (barWidth + gap);
    const y =
      bottom -
      barHeight;
    /*
       Основная полоска.
    */
    ctx.fillStyle =
      'rgba(255, 80, 150, 0.55)';
    ctx.fillRect(
      x,
      y,
      barWidth,
      barHeight
    );
    /*
       Маленький glow.
    */
    ctx.shadowBlur = 12;
    ctx.shadowColor =
      '#ff4d8d';
    ctx.fillStyle =
      'rgba(255, 100, 170, 0.35)';
    ctx.fillRect(
      x,
      y,
      barWidth,
      2
    );
  }
  ctx.restore();
}
/* =========================
   DRAW HEART
========================= */
function drawHeart(audioData) {
  const cx =
    window.innerWidth / 2;
  const cy =
    window.innerHeight / 2 - 10;
  /*
     Базовый масштаб.
  */
  let heartScale = 1;
  if (audioData) {
    /*
       Постоянная реакция
       на бас.
    */
    heartScale +=
      bassPulse * 0.10;
    /*
       Резкий удар.
    */
    heartScale +=
      kickPulse * 0.22;
  }
  /*
     На кике сердце немного
     расширяется.
  */
  for (
    let i = particles.length - 1;
    i >= 0;
    i--
  ) {
    const p =
      particles[i];
    /*
       Целевая форма сердца
       увеличивается вместе
       с басом.
    */
    const targetX =
      p.tx * heartScale;
    const targetY =
      p.ty * heartScale;
    /*
       Удар кика.
    */
    if (kickPulse > 0.08) {
      const angle =
        Math.atan2(
          p.y,
          p.x
        );
      const force =
        kickPulse *
        7;
      p.vx +=
        Math.cos(angle) *
        force *
        0.12;
      p.vy +=
        Math.sin(angle) *
        force *
        0.12;
    } else {
      /*
         Возвращение к форме.
      */
      p.vx +=
        (targetX - p.x) *
        0.075;
      p.vy +=
        (targetY - p.y) *
        0.075;
    }
    /*
       Движение.
    */
    p.x += p.vx;
    p.y += p.vy;
    /*
       Сопротивление.
    */
    p.vx *= 0.87;
    p.vy *= 0.87;
    /*
       Жизнь частицы.
    */
    p.life -=
      p.decay;
    if (p.life <= 0) {
      particles.splice(i, 1);
      continue;
    }
    /*
       Рисование.
    */
    ctx.beginPath();
    ctx.arc(
      cx + p.x,
      cy + p.y,
      p.size *
      Math.max(
        p.life,
        0.3
      ) *
      (1 + kickPulse * 0.25),
      0,
      Math.PI * 2
    );
    ctx.fillStyle =
      p.color;
    ctx.globalAlpha =
      p.life * 0.92;
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  /*
     Поддерживаем количество частиц.
  */
  if (particles.length < 700) {
    for (
      let i = particles.length;
      i < 780;
      i++
    ) {
      particles.push(
        createParticle()
      );
    }
  }
  if (particles.length > 1400) {
    particles.splice(
      0,
      particles.length - 1400
    );
  }
}
/* =========================
   MAIN LOOP
========================= */
function draw() {
  ctx.fillStyle =
    '#000';
  ctx.fillRect(
    0,
    0,
    window.innerWidth,
    window.innerHeight
  );
  let audioData = null;
  if (isPlaying && analyser) {
    audioData =
      updateAudio();
  }
  drawHeart(
    audioData
  );
  drawEqualizer(
    audioData
  );
  requestAnimationFrame(
    draw
  );
}
/* =========================
   AUDIO INITIALIZATION
========================= */
async function initAudio() {
  if (audioCtx) return;
  audioCtx =
    new (
      window.AudioContext ||
      window.webkitAudioContext
    )();
  const source =
    audioCtx.createMediaElementSource(
      audio
    );
  analyser =
    audioCtx.createAnalyser();
  /*
     Чем больше FFT,
     тем лучше частотное
     разрешение.
  */
  analyser.fftSize = 2048;
  /*
     Небольшое сглаживание,
     чтобы эквалайзер не дёргался
     слишком хаотично.
  */
  analyser.smoothingTimeConstant =
    0.18;
  dataArray =
    new Uint8Array(
      analyser.frequencyBinCount
    );
  source.connect(
    analyser
  );
  analyser.connect(
    audioCtx.destination
  );
}
/* =========================
   PLAY BUTTON
========================= */
playBtn.addEventListener(
  'click',
  async () => {
    if (!isPlaying) {
      try {
        await initAudio();
        if (
          audioCtx.state ===
          'suspended'
        ) {
          await audioCtx.resume();
        }
        await audio.play();
        isPlaying = true;
        prevBass = 0;
        kickPulse = 0;
        bassPulse = 0;
        lastKickTime = 0;
        initHeart();
        playBtn.textContent =
          '⏸ Пауза';
      } catch (e) {
        console.error(e);
        alert(
          'Ошибка аудио'
        );
      }
    } else {
      audio.pause();
      isPlaying = false;
      playBtn.textContent =
        '▶ Запустить';
    }
  }
);
/* =========================
   START
========================= */
initHeart();
requestAnimationFrame(
  draw
);
</script>
</body>
</html>
