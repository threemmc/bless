<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Heart</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: #000000;
      overflow: hidden;
      touch-action: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #000000;
    }
    .back {
      position: fixed;
      top: 14px;
      left: 14px;
      color: #555;
      text-decoration: none;
      font-size: 14px;
      z-index: 10;
    }
    .controls {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
    }
    button {
      background: #000;
      border: 1px solid #333;
      color: #bbb;
      padding: 11px 24px;
      border-radius: 10px;
      font-size: 14px;
      min-width: 170px;
    }
  </style>
</head>
<body>
  <a href="index.html" class="back">← меню</a>
  <canvas id="canvas"></canvas>

  <div class="controls">
    <button id="playBtn">▶ Запустить</button>
  </div>

  <audio id="audio" src="white_tee.mp3" loop preload="auto"></audio>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const audio = document.getElementById('audio');
    const playBtn = document.getElementById('playBtn');

    let particles = [];
    let isPlaying = false;
    let lastBeat = 0;
    let startTime = 0;
    let scalePulse = 1;

    const BPM = 150;
    const BEAT_MS = 60000 / BPM;
    const colors = ['#ff4d8d', '#ff6b9d', '#ff8fb8', '#e91e8c', '#ff5e9c'];

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = window.innerWidth * dpr;
      canvas.height = window.innerHeight * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resize();
    window.addEventListener('resize', resize);

    function heart(a, scale) {
      const x = 16 * Math.pow(Math.sin(a), 3) * scale;
      const y = (13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a)) * scale;
      return { x, y: -y };
    }

    function spawnBurst(intensity = 1) {
      // Уменьшенный масштаб сердца под телефон
      const baseScale = Math.min(window.innerWidth, window.innerHeight) / 55;
      const count = Math.floor(80 + Math.random() * 50) * intensity;

      for (let i = 0; i < count; i++) {
        const a = Math.random() * Math.PI * 2;
        const sc = (0.6 + Math.random() * 11.5) * scalePulse * (baseScale / 12);
        const pos = heart(a, sc);
        const spread = (Math.random() - 0.5) * 2.5;

        particles.push({
          x: pos.x + spread,
          y: pos.y + spread,
          size: 0.55 + Math.random() * 1.0,
          color: colors[Math.floor(Math.random() * colors.length)],
          life: 1,
          decay: 0.0045 + Math.random() * 0.005,
          vx: (Math.random() - 0.5) * 0.18,
          vy: (Math.random() - 0.5) * 0.18
        });
      }
    }

    function draw(timestamp) {
      // Полностью чёрный фон каждый кадр
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

      const cx = window.innerWidth / 2;
      const cy = window.innerHeight / 2 - 20; // чуть выше центра

      if (isPlaying) {
        const elapsed = timestamp - startTime;
        if (elapsed - lastBeat >= BEAT_MS) {
          lastBeat = elapsed;
          scalePulse = 1.09;
          spawnBurst(1);
          if (Math.floor(elapsed / BEAT_MS) % 4 === 0) {
            spawnBurst(1.25);
            scalePulse = 1.16;
          }
        }
        scalePulse += (1 - scalePulse) * 0.09;
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.life -= p.decay;
        p.x += p.vx;
        p.y += p.vy;

        if (p.life <= 0) {
          particles.splice(i, 1);
          continue;
        }

        // Только чистая точка, без обводки и свечения
        ctx.beginPath();
        ctx.arc(cx + p.x, cy + p.y, p.size * p.life, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life * 0.88;
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      if (particles.length > 3800) particles.splice(0, particles.length - 3800);
      requestAnimationFrame(draw);
    }

    playBtn.addEventListener('click', async () => {
      if (!isPlaying) {
        try {
          await audio.play();
          isPlaying = true;
          startTime = performance.now();
          lastBeat = 0;
          particles = [];
          spawnBurst(1.3);
          playBtn.textContent = '⏸ Пауза';
        } catch (e) {
          alert('Не удалось запустить аудио');
        }
      } else {
        audio.pause();
        isPlaying = false;
        playBtn.textContent = '▶ Запустить';
      }
    });

    requestAnimationFrame(draw);
  </script>
</body>
</html>
