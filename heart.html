<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Heart</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      touch-action: none;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #000;
    }

    .back {
      position: fixed;
      top: 14px;
      left: 14px;
      color: #555;
      text-decoration: none;
      font-size: 14px;
      z-index: 10;
    }

    .controls {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
    }

    button {
      background: #000;
      border: 1px solid #333;
      color: #bbb;
      padding: 11px 24px;
      border-radius: 10px;
      font-size: 14px;
      min-width: 170px;
    }
  </style>
</head>

<body>

<a href="index.html" class="back">← меню</a>

<canvas id="canvas"></canvas>

<div class="controls">
  <button id="playBtn">▶ Запустить</button>
</div>

<audio
  id="audio"
  src="white_tee.mp3"
  preload="auto">
</audio>

<script>

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

const audio = document.getElementById('audio');
const playBtn = document.getElementById('playBtn');


/* =========================================================
   AUDIO
========================================================= */

let audioCtx = null;
let analyser = null;
let dataArray = null;

let isPlaying = false;


/* =========================================================
   PARTICLES
========================================================= */

let particles = [];

const PARTICLE_COUNT = 850;

const colors = [
  '#ff4d8d',
  '#ff6b9d',
  '#ff8fb8',
  '#e91e8c',
  '#ff5e9c'
];


/* =========================================================
   HEARTBEAT
========================================================= */

let beat = 0;

/*
  Текущая сила баса.
*/
let bassLevel = 0;

/*
  История энергии кика.
  Она нужна, чтобы понимать:
  "это реально новый удар?"
  вместо:
  "бас просто играет?"
*/
let kickHistory = [];

/*
  Время последнего обнаруженного удара.
*/
let lastKickTime = 0;


/*
  Минимальное расстояние между
  двумя ударами.

  140 мс ≈ максимум около 7 ударов/сек,
  чего для обычного кика более чем достаточно.
*/
const KICK_COOLDOWN = 140;


/* =========================================================
   RESIZE
========================================================= */

function resize() {

  const dpr =
    Math.min(
      window.devicePixelRatio || 1,
      2
    );

  canvas.width =
    window.innerWidth * dpr;

  canvas.height =
    window.innerHeight * dpr;

  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );
}

resize();

window.addEventListener(
  'resize',
  resize
);


/* =========================================================
   HEART EQUATION
========================================================= */

function heart(a, scale) {

  const x =
    16 *
    Math.pow(Math.sin(a), 3) *
    scale;

  const y =
    (
      13 * Math.cos(a) -
      5 * Math.cos(2 * a) -
      2 * Math.cos(3 * a) -
      Math.cos(4 * a)
    ) * scale;

  return {
    x: x,
    y: -y
  };
}


/* =========================================================
   CREATE PARTICLE
========================================================= */

function createParticle() {

  const base =
    Math.min(
      window.innerWidth,
      window.innerHeight
    ) / 55;

  const a =
    Math.random() *
    Math.PI *
    2;

  const sc =
    (
      0.6 +
      Math.random() * 10.5
    ) *
    (base / 12);

  const pos =
    heart(a, sc);

  return {

    tx: pos.x,
    ty: pos.y,

    x: pos.x,
    y: pos.y,

    size:
      0.55 +
      Math.random() * 1.1,

    color:
      colors[
        Math.floor(
          Math.random() *
          colors.length
        )
      ],

    life: 1,

    decay:
      0.002 +
      Math.random() * 0.0028,

    vx: 0,
    vy: 0
  };
}


/* =========================================================
   INIT HEART
========================================================= */

function initHeart() {

  particles = [];

  for (
    let i = 0;
    i < PARTICLE_COUNT;
    i++
  ) {

    particles.push(
      createParticle()
    );
  }
}


/* =========================================================
   FREQUENCY ANALYSIS
========================================================= */

function getBands() {

  analyser.getByteFrequencyData(
    dataArray
  );

  const binHz =
    audioCtx.sampleRate /
    analyser.fftSize;


  function getAverage(minHz, maxHz) {

    const start =
      Math.max(
        0,
        Math.floor(
          minHz / binHz
        )
      );

    const end =
      Math.min(
        dataArray.length,
        Math.ceil(
          maxHz / binHz
        )
      );

    let sum = 0;

    for (
      let i = start;
      i < end;
      i++
    ) {

      sum += dataArray[i];
    }

    return (
      sum /
      Math.max(
        1,
        end - start
      ) /
      255
    );
  }


  /*
    Отдельные диапазоны.

    20–60:
    саббас

    60–120:
    основной кик

    120–200:
    тело кика

    200–2000:
    середина

    2000–8000:
    верх
  */

  const sub =
    getAverage(20, 60);

  const kick =
    getAverage(60, 120);

  const kickBody =
    getAverage(120, 200);

  const mid =
    getAverage(200, 2000);

  const high =
    getAverage(2000, 8000);


  return {
    sub,
    kick,
    kickBody,
    mid,
    high
  };
}


/* =========================================================
   KICK DETECTOR
========================================================= */

function detectKick(bands) {

  /*
    Формируем энергию именно
    низкого удара.

    Главный вес:
    60–120 Hz.

    Саб и тело используются
    как дополнительные признаки.
  */

  const energy =
      bands.kick * 0.65 +
      bands.sub * 0.20 +
      bands.kickBody * 0.15;


  /*
    Добавляем новое значение
    в историю.
  */

  kickHistory.push(
    energy
  );


  /*
    История примерно последних
    200–250 мс.

    При 60 FPS это около 15 кадров.
  */

  if (
    kickHistory.length > 15
  ) {

    kickHistory.shift();
  }


  /*
    Если истории пока мало,
    не пытаемся определить удар.
  */

  if (
    kickHistory.length < 8
  ) {

    return false;
  }


  /*
    Находим средний уровень
    недавнего баса.

    Это наш "обычный уровень".
  */

  let sum = 0;

  for (
    let i = 0;
    i < kickHistory.length - 1;
    i++
  ) {

    sum += kickHistory[i];
  }

  const average =
    sum /
    (kickHistory.length - 1);


  /*
    Нас интересует насколько
    текущая энергия выше
    обычной.
  */

  const rise =
    energy - average;


  /*
    Дополнительная проверка:

    кик должен быть достаточно
    громким сам по себе.
  */

  const loudEnough =
    energy > 0.16;


  /*
    И он должен заметно вырасти
    относительно недавнего уровня.
  */

  const strongAttack =
    rise > 0.035;


  /*
    Не разрешаем несколько ударов
    подряд от одного и того же
    длинного басового сигнала.
  */

  const now =
    performance.now();

  const cooldownPassed =
    now - lastKickTime >
    KICK_COOLDOWN;


  /*
    Финальное решение.
  */

  if (
    loudEnough &&
    strongAttack &&
    cooldownPassed
  ) {

    lastKickTime = now;

    return true;
  }


  return false;
}


/* =========================================================
   AUDIO UPDATE
========================================================= */

function updateAudio() {

  const bands =
    getBands();


  /*
    Определяем новый удар.
  */

  const isKick =
    detectKick(bands);


  if (isKick) {

    /*
      Настоящий новый удар.

      Не постоянный бас,
      а именно атака.
    */

    beat = 1;
  }


  /*
    Удар быстро затухает.

    1
    ↓
    0.84
    ↓
    0.70
    ↓
    0.59
    ↓
    ...
  */

  beat *= 0.84;


  /*
    Бас влияет на сердце
    намного слабее.

    Поэтому постоянный бас
    не превращается в
    постоянное сердцебиение.
  */

  bassLevel =
    bassLevel * 0.88 +
    (
      bands.sub * 0.55 +
      bands.kick * 0.45
    ) * 0.12;


  return bands;
}


/* =========================================================
   DRAW HEART
========================================================= */

function drawHeart() {

  const cx =
    window.innerWidth / 2;

  const cy =
    window.innerHeight / 2 - 10;


  /*
    Базовый размер сердца.
  */

  let scale =
    1;


  /*
    Постоянный бас:
    очень маленькое изменение.
  */

  scale +=
    bassLevel * 0.055;


  /*
    Настоящий кик:
    заметный удар.

    Сердце увеличивается,
    но не разлетается.
  */

  scale +=
    beat * 0.18;


  for (
    let i = particles.length - 1;
    i >= 0;
    i--
  ) {

    const p =
      particles[i];


    /*
      Новая целевая позиция.
    */

    const targetX =
      p.tx * scale;

    const targetY =
      p.ty * scale;


    /*
      Плавное движение
      к форме сердца.
    */

    p.vx +=
      (
        targetX -
        p.x
      ) * 0.075;

    p.vy +=
      (
        targetY -
        p.y
      ) * 0.075;


    /*
      Маленький импульс
      наружу непосредственно
      во время удара.

      Он очень слабый специально:
      сердце должно "биться",
      а не взрываться.
    */

    if (
      beat > 0.45
    ) {

      const distance =
        Math.sqrt(
          p.x * p.x +
          p.y * p.y
        ) || 1;

      const nx =
        p.x / distance;

      const ny =
        p.y / distance;


      const impulse =
        beat * 0.20;


      p.vx +=
        nx * impulse;

      p.vy +=
        ny * impulse;
    }


    /*
      Движение.
    */

    p.x += p.vx;
    p.y += p.vy;


    /*
      Сопротивление.
    */

    p.vx *= 0.84;
    p.vy *= 0.84;


    /*
      Жизнь.
    */

    p.life -=
      p.decay;


    if (
      p.life <= 0
    ) {

      particles.splice(
        i,
        1
      );

      continue;
    }


    /*
      Размер частицы.

      На ударе чуть увеличивается.
    */

    const size =
      p.size *
      Math.max(
        p.life,
        0.3
      ) *
      (
        1 +
        beat * 0.15
      );


    ctx.beginPath();

    ctx.arc(
      cx + p.x,
      cy + p.y,
      size,
      0,
      Math.PI * 2
    );


    ctx.fillStyle =
      p.color;

    ctx.globalAlpha =
      p.life * 0.92;

    ctx.fill();
  }


  ctx.globalAlpha = 1;


  /*
    Поддерживаем количество
    частиц постоянным.
  */

  while (
    particles.length <
    PARTICLE_COUNT
  ) {

    particles.push(
      createParticle()
    );
  }
}


/* =========================================================
   MAIN LOOP
========================================================= */

function draw() {

  ctx.fillStyle =
    '#000';

  ctx.fillRect(
    0,
    0,
    window.innerWidth,
    window.innerHeight
  );


  if (
    isPlaying &&
    analyser
  ) {

    updateAudio();
  } else {

    /*
      Если музыка остановлена,
      никаких старых импульсов.
    */

    beat *= 0.82;
    bassLevel *= 0.92;
  }


  drawHeart();


  requestAnimationFrame(
    draw
  );
}


/* =========================================================
   AUDIO INITIALIZATION
========================================================= */

async function initAudio() {

  if (audioCtx) {
    return;
  }


  audioCtx =
    new (
      window.AudioContext ||
      window.webkitAudioContext
    )();


  const source =
    audioCtx.createMediaElementSource(
      audio
    );


  analyser =
    audioCtx.createAnalyser();


  /*
    2048 достаточно хорошо
    разделяет низкие частоты.
  */

  analyser.fftSize =
    2048;


  /*
    Маленькое сглаживание.

    Нам нужна быстрая атака кика.
  */

  analyser.smoothingTimeConstant =
    0.08;


  dataArray =
    new Uint8Array(
      analyser.frequencyBinCount
    );


  source.connect(
    analyser
  );

  analyser.connect(
    audioCtx.destination
  );
}


/* =========================================================
   PLAY BUTTON
========================================================= */

playBtn.addEventListener(
  'click',
  async () => {

    if (!isPlaying) {

      try {

        await initAudio();


        if (
          audioCtx.state ===
          'suspended'
        ) {

          await audioCtx.resume();
        }


        await audio.play();


        isPlaying = true;


        /*
          Сбрасываем детектор.
        */

        kickHistory = [];

        beat = 0;

        bassLevel = 0;

        lastKickTime = 0;


        initHeart();


        playBtn.textContent =
          '⏸ Пауза';

      } catch (error) {

        console.error(
          error
        );

        alert(
          'Ошибка аудио'
        );
      }

    } else {

      audio.pause();

      isPlaying = false;

      playBtn.textContent =
        '▶ Запустить';
    }
  }
);


/* =========================================================
   START
========================================================= */

initHeart();

requestAnimationFrame(
  draw
);

</script>

</body>
</html>
