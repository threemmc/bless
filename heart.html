<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Heart</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #000;
      overflow: hidden;
      touch-action: none;
    }
    canvas { display: block; width: 100%; height: 100%; background: #000; }
    .back {
      position: fixed; top: 14px; left: 14px;
      color: #555; text-decoration: none; font-size: 14px; z-index: 10;
    }
    .controls {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 10;
    }
    button {
      background: #000; border: 1px solid #333; color: #bbb;
      padding: 11px 24px; border-radius: 10px; font-size: 14px; min-width: 170px;
    }
  </style>
</head>
<body>
  <a href="index.html" class="back">← меню</a>
  <canvas id="canvas"></canvas>
  <div class="controls">
    <button id="playBtn">▶ Запустить</button>
  </div>
  <audio id="audio" src="white_tee.mp3" loop preload="auto" crossorigin="anonymous"></audio>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const audio = document.getElementById('audio');
    const playBtn = document.getElementById('playBtn');

    let particles = [];
    let isPlaying = false;
    let audioCtx, analyser, dataArray;
    let explode = 0; // сила разлёта

    const colors = ['#ff4d8d','#ff6b9d','#ff8fb8','#e91e8c','#ff5e9c'];

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = window.innerWidth * dpr;
      canvas.height = window.innerHeight * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resize();
    window.addEventListener('resize', resize);

    function heart(a, scale) {
      const x = 16 * Math.pow(Math.sin(a), 3) * scale;
      const y = (13 * Math.cos(a) - 5 * Math.cos(2*a) - 2 * Math.cos(3*a) - Math.cos(4*a)) * scale;
      return { x, y: -y };
    }

    function createParticle() {
      const base = Math.min(window.innerWidth, window.innerHeight) / 56;
      const a = Math.random() * Math.PI * 2;
      const sc = (0.6 + Math.random() * 11) * (base / 12);
      const pos = heart(a, sc);

      return {
        // целевая позиция (форма сердца)
        tx: pos.x,
        ty: pos.y,
        // текущая позиция
        x: pos.x,
        y: pos.y,
        size: 0.55 + Math.random() * 1.1,
        color: colors[Math.floor(Math.random() * colors.length)],
        life: 1,
        decay: 0.003 + Math.random() * 0.004,
        // скорость разлёта
        vx: 0,
        vy: 0
      };
    }

    // Создаём базовое количество частиц сердца
    function initHeart() {
      particles = [];
      for (let i = 0; i < 900; i++) {
        particles.push(createParticle());
      }
    }

    function getBass() {
      analyser.getByteFrequencyData(dataArray);
      let sum = 0;
      for (let i = 0; i < 11; i++) sum += dataArray[i];
      return sum / 11 / 255;
    }

    function draw() {
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

      const cx = window.innerWidth / 2;
      const cy = window.innerHeight / 2 - 12;

      if (isPlaying && analyser) {
        const bass = getBass();

        // На сильный кик — включаем разлёт
        if (bass > 0.46) {
          explode = Math.min(1, explode + 0.18);
        } else {
          explode = Math.max(0, explode - 0.035); // плавно возвращаемся
        }

        // Иногда добавляем новые точки
        if (bass > 0.33 && Math.random() < 0.3) {
          particles.push(createParticle());
        }
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];

        if (explode > 0.05) {
          // Разлёт во все стороны
          const angle = Math.atan2(p.y, p.x) + (Math.random() - 0.5) * 0.8;
          const force = explode * (3.5 + Math.random() * 4);
          p.vx += Math.cos(angle) * force * 0.15;
          p.vy += Math.sin(angle) * force * 0.15;
        } else {
          // Возврат к форме сердца
          p.vx += (p.tx - p.x) * 0.045;
          p.vy += (p.ty - p.y) * 0.045;
        }

        p.x += p.vx;
        p.y += p.vy;
        p.vx *= 0.92;
        p.vy *= 0.92;

        p.life -= p.decay;
        if (p.life <= 0) {
          particles.splice(i, 1);
          continue;
        }

        ctx.beginPath();
        ctx.arc(cx + p.x, cy + p.y, p.size * p.life, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life * 0.9;
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      if (particles.length > 1600) particles.splice(0, particles.length - 1600);
      requestAnimationFrame(draw);
    }

    async function initAudio() {
      if (audioCtx) return;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const source = audioCtx.createMediaElementSource(audio);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 512;
      analyser.smoothingTimeConstant = 0.35;
      dataArray = new Uint8Array(analyser.frequencyBinCount);
      source.connect(analyser);
      analyser.connect(audioCtx.destination);
    }

    playBtn.addEventListener('click', async () => {
      if (!isPlaying) {
        try {
          await initAudio();
          if (audioCtx.state === 'suspended') await audioCtx.resume();
          await audio.play();
          isPlaying = true;
          initHeart();
          playBtn.textContent = '⏸ Пауза';
        } catch (e) {
          alert('Ошибка аудио');
        }
      } else {
        audio.pause();
        isPlaying = false;
        playBtn.textContent = '▶ Запустить';
      }
    });

    requestAnimationFrame(draw);
  </script>
</body>
</html>
