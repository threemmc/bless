<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Heart — White Tee</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: #000000;
      overflow: hidden;
      touch-action: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #000000;
    }
    .back {
      position: fixed;
      top: 16px;
      left: 16px;
      color: rgba(255, 170, 200, 0.4);
      text-decoration: none;
      font-size: 15px;
      z-index: 10;
      padding: 6px 10px;
    }
    .controls {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
    }
    button {
      background: rgba(255, 80, 140, 0.18);
      border: 1px solid rgba(255, 130, 180, 0.35);
      color: #ffb0d0;
      padding: 12px 26px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 15px;
      min-width: 200px;
    }
  </style>
</head>
<body>
  <a href="index.html" class="back">← меню</a>
  <canvas id="canvas"></canvas>

  <div class="controls">
    <button id="playBtn">▶ Запустить</button>
  </div>

  <audio id="audio" src="white_tee.mp3" loop preload="auto"></audio>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const audio = document.getElementById('audio');
    const playBtn = document.getElementById('playBtn');

    let particles = [];
    let isPlaying = false;
    let lastBeat = 0;
    let startTime = 0;
    let scalePulse = 1;

    const BPM = 150;
    const BEAT_MS = 60000 / BPM;

    const colors = [
      '#ff4d8d', '#ff6b9d', '#ff8fb8',
      '#e91e8c', '#ff5e9c', '#ff79b0'
    ];

    function resize() {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = window.innerWidth * dpr;
      canvas.height = window.innerHeight * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resize();
    window.addEventListener('resize', resize);

    function heart(a, scale) {
      const x = 16 * Math.pow(Math.sin(a), 3) * scale;
      const y = (13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a)) * scale;
      return { x, y: -y };
    }

    function spawnBurst(intensity = 1) {
      const count = Math.floor(100 + Math.random() * 60) * intensity;

      for (let i = 0; i < count; i++) {
        const a = Math.random() * Math.PI * 2;
        const sc = (0.7 + Math.random() * 14.2) * scalePulse;
        const pos = heart(a, sc);
        const spread = (Math.random() - 0.5) * 3.5;

        particles.push({
          x: pos.x + spread,
          y: pos.y + spread,
          size: 0.65 + Math.random() * 1.25,
          color: colors[Math.floor(Math.random() * colors.length)],
          life: 1,
          decay: 0.0042 + Math.random() * 0.005,
          vx: (Math.random() - 0.5) * 0.22,
          vy: (Math.random() - 0.5) * 0.22
        });
      }
    }

    function draw(timestamp) {
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

      const cx = window.innerWidth / 2;
      const cy = window.innerHeight / 2;

      if (isPlaying) {
        const elapsed = timestamp - startTime;

        if (elapsed - lastBeat >= BEAT_MS) {
          lastBeat = elapsed;
          scalePulse = 1.11;
          spawnBurst(1.0);

          if (Math.floor(elapsed / BEAT_MS) % 4 === 0) {
            spawnBurst(1.35);
            scalePulse = 1.2;
          }
        }
        scalePulse += (1 - scalePulse) * 0.08;
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.life -= p.decay;
        p.x += p.vx;
        p.y += p.vy;

        if (p.life <= 0) {
          particles.splice(i, 1);
          continue;
        }

        const radius = p.size * (0.75 + p.life * 0.25);

        // Чистая точка без свечения
        ctx.beginPath();
        ctx.arc(cx + p.x, cy + p.y, radius, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life * 0.92;
        ctx.fill();
      }

      ctx.globalAlpha = 1;

      if (particles.length > 4500) {
        particles.splice(0, particles.length - 4500);
      }

      requestAnimationFrame(draw);
    }

    playBtn.addEventListener('click', async () => {
      if (!isPlaying) {
        try {
          await audio.play();
          isPlaying = true;
          startTime = performance.now();
          lastBeat = 0;
          particles = [];
          spawnBurst(1.5);
          playBtn.textContent = '⏸ Пауза';
        } catch (err) {
          alert('Не удалось запустить аудио. Проверьте файл white_tee.mp3');
        }
      } else {
        audio.pause();
        isPlaying = false;
        playBtn.textContent = '▶ Запустить';
      }
    });

    requestAnimationFrame(draw);
  </script>
</body>
</html>
