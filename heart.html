<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Heart</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      touch-action: none;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #000;
    }

    .back {
      position: fixed;
      top: 14px;
      left: 14px;
      color: #555;
      text-decoration: none;
      font-size: 14px;
      z-index: 10;
    }

    .controls {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
    }

    button {
      background: #000;
      border: 1px solid #333;
      color: #bbb;
      padding: 11px 24px;
      border-radius: 10px;
      font-size: 14px;
      min-width: 170px;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.97);
    }
  </style>
</head>

<body>

<a href="index.html" class="back">← меню</a>

<canvas id="canvas"></canvas>

<div class="controls">
  <button id="playBtn">▶ Запустить</button>
</div>

<audio
  id="audio"
  src="white_tee.mp3"
  preload="auto">
</audio>


<script>

/* =========================================================
   WEBGL
========================================================= */

const canvas =
  document.getElementById('canvas');

const gl =
  canvas.getContext('webgl', {
    alpha: false,
    antialias: false,
    powerPreference: 'high-performance'
  });

if (!gl) {
  alert('WebGL не поддерживается этим браузером.');
  throw new Error('WebGL unavailable');
}


/* =========================================================
   AUDIO
========================================================= */

const audio =
  document.getElementById('audio');

const playBtn =
  document.getElementById('playBtn');

let audioCtx = null;
let analyser = null;
let dataArray = null;
let previousSpectrum = null;

let isPlaying = false;


/* =========================================================
   PARTICLES
========================================================= */

const PARTICLE_COUNT = 4000;

const positions =
  new Float32Array(PARTICLE_COUNT * 2);

const velocities =
  new Float32Array(PARTICLE_COUNT * 2);

const targets =
  new Float32Array(PARTICLE_COUNT * 2);

const sizes =
  new Float32Array(PARTICLE_COUNT);

const randoms =
  new Float32Array(PARTICLE_COUNT);

const particleAlpha =
  new Float32Array(PARTICLE_COUNT);

const particlePhase =
  new Float32Array(PARTICLE_COUNT);


/* =========================================================
   HEART STATE
========================================================= */

let beat = 0;
let heartScale = 1;

let kickHistory = [];
let fluxHistory = [];

let lastKickTime = 0;

const KICK_COOLDOWN = 140;


/* =========================================================
   SHADERS
========================================================= */

const vertexShaderSource = `

attribute vec2 a_position;
attribute float a_size;
attribute float a_alpha;
attribute float a_random;

uniform vec2 u_resolution;
uniform float u_scale;
uniform float u_beat;
uniform float u_time;

varying float v_alpha;
varying float v_random;

void main() {

    vec2 position = a_position;

    /*
      Очень маленькое живое движение.
      Оно НЕ зависит от баса.
      Оно только слегка оживляет частицы.
    */

    float wave =
        sin(
            u_time * 1.4 +
            a_random * 20.0
        ) * 0.12;

    position +=
        normalize(position + vec2(0.0001)) *
        wave *
        (0.2 + u_beat * 0.4);

    position *= u_scale;

    vec2 zeroToOne =
        position / u_resolution;

    vec2 zeroToTwo =
        zeroToOne * 2.0;

    vec2 clipSpace =
        zeroToTwo - 1.0;

    clipSpace.y *= -1.0;

    gl_Position =
        vec4(clipSpace, 0.0, 1.0);

    gl_PointSize =
        a_size *
        (
          1.0 +
          u_beat * 0.16
        );

    v_alpha =
        a_alpha *
        (
          0.78 +
          u_beat * 0.22
        );

    v_random =
        a_random;
}
`;


const fragmentShaderSource = `

precision mediump float;

varying float v_alpha;
varying float v_random;

void main() {

    vec2 uv =
        gl_PointCoord -
        vec2(0.5);

    float dist =
        length(uv);

    float alpha =
        smoothstep(
            0.5,
            0.05,
            dist
        );

    vec3 color =
        mix(
            vec3(1.0, 0.20, 0.48),
            vec3(1.0, 0.55, 0.72),
            v_random
        );

    gl_FragColor =
        vec4(
            color,
            alpha * v_alpha
        );
}
`;


/* =========================================================
   SHADER HELPERS
========================================================= */

function createShader(
  type,
  source
) {

  const shader =
    gl.createShader(type);

  gl.shaderSource(
    shader,
    source
  );

  gl.compileShader(
    shader
  );

  if (
    !gl.getShaderParameter(
      shader,
      gl.COMPILE_STATUS
    )
  ) {

    console.error(
      gl.getShaderInfoLog(shader)
    );

    throw new Error(
      'Shader compilation error'
    );
  }

  return shader;
}


function createProgram(
  vertexSource,
  fragmentSource
) {

  const vertexShader =
    createShader(
      gl.VERTEX_SHADER,
      vertexSource
    );

  const fragmentShader =
    createShader(
      gl.FRAGMENT_SHADER,
      fragmentSource
    );

  const program =
    gl.createProgram();

  gl.attachShader(
    program,
    vertexShader
  );

  gl.attachShader(
    program,
    fragmentShader
  );

  gl.linkProgram(
    program
  );

  if (
    !gl.getProgramParameter(
      program,
      gl.LINK_STATUS
    )
  ) {

    console.error(
      gl.getProgramInfoLog(program)
    );

    throw new Error(
      'Program linking error'
    );
  }

  return program;
}


const program =
  createProgram(
    vertexShaderSource,
    fragmentShaderSource
  );

gl.useProgram(program);


/* =========================================================
   ATTRIBUTES / UNIFORMS
========================================================= */

const positionLocation =
  gl.getAttribLocation(
    program,
    'a_position'
  );

const sizeLocation =
  gl.getAttribLocation(
    program,
    'a_size'
  );

const alphaLocation =
  gl.getAttribLocation(
    program,
    'a_alpha'
  );

const randomLocation =
  gl.getAttribLocation(
    program,
    'a_random'
  );


const resolutionLocation =
  gl.getUniformLocation(
    program,
    'u_resolution'
  );

const scaleLocation =
  gl.getUniformLocation(
    program,
    'u_scale'
  );

const beatLocation =
  gl.getUniformLocation(
    program,
    'u_beat'
  );

const timeLocation =
  gl.getUniformLocation(
    program,
    'u_time'
  );


/* =========================================================
   GPU BUFFERS
========================================================= */

const positionBuffer =
  gl.createBuffer();

const sizeBuffer =
  gl.createBuffer();

const alphaBuffer =
  gl.createBuffer();

const randomBuffer =
  gl.createBuffer();


gl.bindBuffer(
  gl.ARRAY_BUFFER,
  positionBuffer
);

gl.bufferData(
  gl.ARRAY_BUFFER,
  positions,
  gl.DYNAMIC_DRAW
);

gl.enableVertexAttribArray(
  positionLocation
);

gl.vertexAttribPointer(
  positionLocation,
  2,
  gl.FLOAT,
  false,
  0,
  0
);


gl.bindBuffer(
  gl.ARRAY_BUFFER,
  sizeBuffer
);

gl.bufferData(
  gl.ARRAY_BUFFER,
  sizes,
  gl.STATIC_DRAW
);

gl.enableVertexAttribArray(
  sizeLocation
);

gl.vertexAttribPointer(
  sizeLocation,
  1,
  gl.FLOAT,
  false,
  0,
  0
);


gl.bindBuffer(
  gl.ARRAY_BUFFER,
  alphaBuffer
);

gl.bufferData(
  gl.ARRAY_BUFFER,
  particleAlpha,
  gl.STATIC_DRAW
);

gl.enableVertexAttribArray(
  alphaLocation
);

gl.vertexAttribPointer(
  alphaLocation,
  1,
  gl.FLOAT,
  false,
  0,
  0
);


gl.bindBuffer(
  gl.ARRAY_BUFFER,
  randomBuffer
);

gl.bufferData(
  gl.ARRAY_BUFFER,
  randoms,
  gl.STATIC_DRAW
);

gl.enableVertexAttribArray(
  randomLocation
);

gl.vertexAttribPointer(
  randomLocation,
  1,
  gl.FLOAT,
  false,
  0,
  0
);


/* =========================================================
   BLENDING
========================================================= */

gl.enable(
  gl.BLEND
);

gl.blendFunc(
  gl.SRC_ALPHA,
  gl.ONE);


/* =========================================================
   RESIZE
========================================================= */

let screenWidth = 0;
let screenHeight = 0;

function resize() {

  const dpr =
    Math.min(
      window.devicePixelRatio || 1,
      2
    );

  screenWidth =
    window.innerWidth;

  screenHeight =
    window.innerHeight;

  canvas.width =
    screenWidth * dpr;

  canvas.height =
    screenHeight * dpr;

  gl.viewport(
    0,
    0,
    canvas.width,
    canvas.height
  );

  gl.uniform2f(
    resolutionLocation,
    canvas.width,
    canvas.height
  );

  initHeart();
}

window.addEventListener(
  'resize',
  resize
);


/* =========================================================
   HEART EQUATION
========================================================= */

function heart(
  a,
  scale
) {

  const x =
    16 *
    Math.pow(
      Math.sin(a),
      3
    ) *
    scale;

  const y =
    (
      13 * Math.cos(a) -
      5 * Math.cos(2 * a) -
      2 * Math.cos(3 * a) -
      Math.cos(4 * a)
    ) *
    scale;

  return {
    x,
    y: -y
  };
}


/* =========================================================
   CREATE HEART
========================================================= */

function initHeart() {

  const base =
    Math.min(
      screenWidth,
      screenHeight
    ) / 55;


  for (
    let i = 0;
    i < PARTICLE_COUNT;
    i++
  ) {

    const a =
      (
        i /
        PARTICLE_COUNT
      ) *
      Math.PI *
      2;


    const radius =
      0.60 +
      Math.random() * 10.5;


    const sc =
      radius *
      (base / 12);


    const pos =
      heart(
        a,
        sc
      );


    const index =
      i * 2;


    targets[index] =
      pos.x;

    targets[index + 1] =
      pos.y;


    positions[index] =
      pos.x;

    positions[index + 1] =
      pos.y;


    velocities[index] = 0;
    velocities[index + 1] = 0;


    sizes[i] =
      1.2 +
      Math.random() * 2.2;


    randoms[i] =
      Math.random();


    particleAlpha[i] =
      0.55 +
      Math.random() * 0.45;


    particlePhase[i] =
      Math.random() *
      Math.PI *
      2;
  }


  gl.bindBuffer(
    gl.ARRAY_BUFFER,
    positionBuffer
  );

  gl.bufferSubData(
    gl.ARRAY_BUFFER,
    0,
    positions
  );
}


/* =========================================================
   KICK FREQUENCY
========================================================= */

/*
   ВАЖНО:

   Саб 20–80 Hz здесь полностью отсутствует.

   Для heartbeat используется ТОЛЬКО:

   80–200 Hz

   Это диапазон кика, который мы
   используем для определения удара.
*/

function getKickEnergy() {

  analyser.getByteFrequencyData(
    dataArray
  );


  const binHz =
    audioCtx.sampleRate /
    analyser.fftSize;


  const start =
    Math.max(
      0,
      Math.floor(
        80 / binHz
      )
    );


  const end =
    Math.min(
      dataArray.length,
      Math.ceil(
        200 / binHz
      )
    );


  let sum = 0;


  for (
    let i = start;
    i < end;
    i++
  ) {

    sum +=
      dataArray[i] / 255;
  }


  return (
    sum /
    Math.max(
      1,
      end - start
    )
  );
}


/* =========================================================
   KICK SPECTRAL FLUX
========================================================= */

/*
   Flux также считаем ТОЛЬКО
   внутри 80–200 Hz.

   Поэтому высокие частоты,
   саб и прочий звук не могут
   сами вызвать heartbeat.
*/

function getKickFlux() {

  const binHz =
    audioCtx.sampleRate /
    analyser.fftSize;


  const start =
    Math.max(
      0,
      Math.floor(
        80 / binHz
      )
    );


  const end =
    Math.min(
      dataArray.length,
      Math.ceil(
        200 / binHz
      )
    );


  let flux = 0;


  for (
    let i = start;
    i < end;
    i++
  ) {

    const current =
      dataArray[i] / 255;

    const previous =
      previousSpectrum[i];


    const diff =
      current -
      previous;


    /*
      Нас интересует только
      появление новой энергии.
    */

    if (diff > 0) {

      flux += diff;
    }


    previousSpectrum[i] =
      current;
  }


  return (
    flux /
    Math.max(
      1,
      end - start
    )
  );
}


/* =========================================================
   KICK DETECTOR
========================================================= */

function detectKick() {

  /*
    Получаем ТОЛЬКО энергию
    80–200 Hz.
  */

  const energy =
    getKickEnergy();


  /*
    Получаем резкий прирост
    энергии именно в 80–200 Hz.
  */

  const flux =
    getKickFlux();


  kickHistory.push(
    energy
  );

  fluxHistory.push(
    flux
  );


  /*
    Около 300 ms истории.
  */

  if (
    kickHistory.length > 18
  ) {

    kickHistory.shift();
  }


  if (
    fluxHistory.length > 18
  ) {

    fluxHistory.shift();
  }


  /*
    Нужно немного истории,
    чтобы понять, был ли резкий
    скачок относительно предыдущего
    состояния.
  */

  if (
    kickHistory.length < 8
  ) {

    return {
      detected: false,
      strength: 0
    };
  }


  let energySum = 0;

  for (
    let i = 0;
    i < kickHistory.length - 1;
    i++
  ) {

    energySum +=
      kickHistory[i];
  }


  const averageEnergy =
    energySum /
    (
      kickHistory.length - 1
    );


  const rise =
    energy -
    averageEnergy;


  let fluxSum = 0;

  for (
    let i = 0;
    i < fluxHistory.length - 1;
    i++
  ) {

    fluxSum +=
      fluxHistory[i];
  }


  const averageFlux =
    fluxSum /
    (
      fluxHistory.length - 1
    );


  const fluxRise =
    flux -
    averageFlux;


  /*
    Кик должен иметь
    достаточно энергии.
  */

  const loudEnough =
    energy > 0.10;


  /*
    Должен быть заметный
    скачок энергии.
  */

  const energyAttack =
    rise > 0.018;


  /*
    Либо заметная атака
    спектра.
  */

  const spectralAttack =
    fluxRise > 0.0025;


  const now =
    performance.now();


  const cooldownPassed =
    now -
    lastKickTime >
    KICK_COOLDOWN;


  /*
    Главное условие:

    80–200 Hz достаточно сильные
    +
    произошла атака
    +
    прошло немного времени
    с предыдущего кика.
  */

  const detected =
    loudEnough &&
    energyAttack &&
    (
      spectralAttack ||
      rise > 0.045
    ) &&
    cooldownPassed;


  if (!detected) {

    return {
      detected: false,
      strength: 0
    };
  }


  lastKickTime =
    now;


  /*
    Сила сердцебиения зависит
    от того, насколько сильно
    вырос кик.

    Ограничиваем значение,
    чтобы очень громкий кик
    не разорвал форму сердца.
  */

  const strength =
    Math.min(
      1,
      Math.max(
        0.25,
        rise * 12 +
        energy * 1.5
      )
    );


  return {
    detected: true,
    strength
  };
}


/* =========================================================
   AUDIO UPDATE
========================================================= */

function updateAudio() {

  /*
    Если аудио реально остановлено,
    никакого анализа.
  */

  if (
    !isPlaying ||
    audio.paused ||
    audio.ended
  ) {

    beat = 0;

    return;
  }


  const kick =
    detectKick();


  /*
    СЕРДЦЕБИЕНИЕ ПРОИСХОДИТ
    ТОЛЬКО ЗДЕСЬ.

    Если kick.detected === false,
    новый heartbeat НЕ создаётся.
  */

  if (kick.detected) {

    beat =
      kick.strength;
  }


  /*
    После удара сердце
    быстро возвращается
    обратно.

    Это не создаёт новые удары —
    просто затухает уже
    обнаруженный кик.
  */

  beat *= 0.82;
}


/* =========================================================
   PARTICLE PHYSICS
========================================================= */

function updateParticles(
  deltaTime
) {

  /*
    НЕТ bassLevel.

    Размер сердца меняется
    исключительно от beat,
    который создаётся только
    обнаруженным киком.
  */

  const targetScale =
    1.0 +
    beat * 0.18;


  heartScale +=
    (
      targetScale -
      heartScale
    ) * 0.20;


  const spring =
    0.075;


  const damping =
    0.82;


  /*
    Импульс исключительно
    от обнаруженного кика.
  */

  const beatImpulse =
    beat * 0.18;


  for (
    let i = 0;
    i < PARTICLE_COUNT;
    i++
  ) {

    const index =
      i * 2;


    let x =
      positions[index];

    let y =
      positions[index + 1];


    let vx =
      velocities[index];

    let vy =
      velocities[index + 1];


    const targetX =
      targets[index] *
      heartScale;


    const targetY =
      targets[index + 1] *
      heartScale;


    /*
      Возврат к форме сердца.
    */

    vx +=
      (
        targetX -
        x
      ) * spring;


    vy +=
      (
        targetY -
        y
      ) * spring;


    /*
      Короткий наружный импульс
      во время heartbeat.
    */

    if (
      beat > 0.25
    ) {

      const length =
        Math.sqrt(
          x * x +
          y * y
        ) || 1;


      const nx =
        x / length;

      const ny =
        y / length;


      vx +=
        nx *
        beatImpulse;


      vy +=
        ny *
        beatImpulse;
    }


    /*
      Микродвижение частиц.
      Оно не связано с аудио
      и не создаёт heartbeat.
    */

    const phase =
      particlePhase[i];


    const micro =
      Math.sin(
        performance.now() * 0.0014 +
        phase
      ) *
      0.008;


    vx +=
      micro *
      0.02;


    vy +=
      micro *
      0.02;


    x +=
      vx *
      deltaTime;


    y +=
      vy *
      deltaTime;


    vx *=
      damping;

    vy *=
      damping;


    positions[index] =
      x;

    positions[index + 1] =
      y;

    velocities[index] =
      vx;

    velocities[index + 1] =
      vy;
  }


  gl.bindBuffer(
    gl.ARRAY_BUFFER,
    positionBuffer
  );

  gl.bufferSubData(
    gl.ARRAY_BUFFER,
    0,
    positions
  );
}


/* =========================================================
   DRAW
========================================================= */

let lastFrameTime =
  performance.now();

function draw() {

  const now =
    performance.now();


  const delta =
    Math.min(
      (now - lastFrameTime) /
      16.666,
      2
    );


  lastFrameTime =
    now;


  /*
    Очень важно:

    проверяем не только свой
    isPlaying, но и реальное
    состояние audio.paused.

    Поэтому после паузы
    никакого продолжения
    анализа быть не может.
  */

  if (
    isPlaying &&
    analyser &&
    !audio.paused &&
    !audio.ended
  ) {

    updateAudio();

  } else {

    /*
      Музыка остановлена.

      Heartbeat сразу исчезает.
    */

    beat *= 0.78;
  }


  updateParticles(
    delta
  );


  gl.clearColor(
    0,
    0,
    0,
    1
  );

  gl.clear(
    gl.COLOR_BUFFER_BIT
  );


  gl.uniform1f(
    scaleLocation,
    1
  );

  gl.uniform1f(
    beatLocation,
    beat
  );

  gl.uniform1f(
    timeLocation,
    now * 0.001
  );


  gl.drawArrays(
    gl.POINTS,
    0,
    PARTICLE_COUNT
  );


  requestAnimationFrame(
    draw
  );
}


/* =========================================================
   AUDIO INITIALIZATION
========================================================= */

async function initAudio() {

  if (audioCtx) {
    return;
  }


  audioCtx =
    new (
      window.AudioContext ||
      window.webkitAudioContext
    )();


  const source =
    audioCtx.createMediaElementSource(
      audio
    );


  analyser =
    audioCtx.createAnalyser();


  /*
    Высокое разрешение FFT.

    При 4096:
    80–200 Hz можно анализировать
    достаточно подробно.
  */

  analyser.fftSize =
    4096;


  /*
    Минимальное сглаживание.

    Нам нужна именно атака кика.
  */

  analyser.smoothingTimeConstant =
    0.035;


  dataArray =
    new Uint8Array(
      analyser.frequencyBinCount
    );


  previousSpectrum =
    new Float32Array(
      analyser.frequencyBinCount
    );


  source.connect(
    analyser
  );


  analyser.connect(
    audioCtx.destination
  );
}


/* =========================================================
   PLAY / PAUSE
========================================================= */

playBtn.addEventListener(
  'click',
  async () => {

    if (!isPlaying) {

      try {

        await initAudio();


        if (
          audioCtx.state ===
          'suspended'
        ) {

          await audioCtx.resume();
        }


        /*
          Перед запуском
          очищаем старые данные.
        */

        kickHistory = [];

        fluxHistory = [];

        previousSpectrum.fill(0);

        beat = 0;

        heartScale = 1;

        lastKickTime = 0;


        await audio.play();


        isPlaying =
          true;


        playBtn.textContent =
          '⏸ Пауза';

      } catch (error) {

        console.error(
          error
        );

        alert(
          'Не удалось запустить аудио.'
        );
      }


    } else {

      audio.pause();

      isPlaying =
        false;


      /*
        Полный сброс heartbeat.
      */

      beat = 0;

      heartScale = 1;

      kickHistory = [];

      fluxHistory = [];

      previousSpectrum.fill(0);

      lastKickTime = 0;


      playBtn.textContent =
        '▶ Запустить';
    }
  }
);


/* =========================================================
   AUDIO ENDED
========================================================= */

audio.addEventListener(
  'ended',
  () => {

    isPlaying =
      false;

    beat = 0;

    heartScale = 1;

    kickHistory = [];

    fluxHistory = [];

    previousSpectrum.fill(0);

    lastKickTime = 0;

    playBtn.textContent =
      '▶ Запустить';
  }
);


/* =========================================================
   START
========================================================= */

resize();

requestAnimationFrame(
  draw
);

</script>

</body>
</html>
