<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Heart</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      touch-action: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #000;
    }
    .back {
      position: fixed;
      top: 14px;
      left: 14px;
      color: #555;
      text-decoration: none;
      font-size: 14px;
      z-index: 10;
    }
    .controls {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
    }
    button {
      background: #000;
      border: 1px solid #333;
      color: #bbb;
      padding: 11px 24px;
      border-radius: 10px;
      font-size: 14px;
      min-width: 170px;
    }
  </style>
</head>
<body>
<a href="index.html" class="back">← меню</a>
<canvas id="canvas"></canvas>
<div class="controls">
  <button id="playBtn">▶ Запустить</button>
</div>
<audio
  id="audio"
  src="white_tee.mp3"
  preload="auto"
  crossorigin="anonymous">
</audio>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const audio = document.getElementById('audio');
const playBtn = document.getElementById('playBtn');
/* =========================================
   AUDIO
========================================= */
let audioCtx = null;
let analyser = null;
let dataArray = null;
let isPlaying = false;
/* =========================================
   HEART
========================================= */
let particles = [];
const PARTICLE_COUNT = 900;
const colors = [
  '#ff4d8d',
  '#ff6b9d',
  '#ff8fb8',
  '#e91e8c',
  '#ff5e9c'
];
/* =========================================
   BEAT STATE
========================================= */
let bass20_60 = 0;
let kick60_120 = 0;
let body120_200 = 0;
let previousKick = 0;
let beat = 0;
let lastBeatTime = 0;
/*
   Насколько сильно сердце
   расширяется на ударе.
*/
let heartbeatScale = 1;
/*
   Небольшое движение частиц
   от самого баса.
*/
let bassMotion = 0;
/* =========================================
   RESIZE
========================================= */
function resize() {
  const dpr =
    Math.min(
      window.devicePixelRatio || 1,
      2
    );
  canvas.width =
    window.innerWidth * dpr;
  canvas.height =
    window.innerHeight * dpr;
  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );
}
resize();
window.addEventListener(
  'resize',
  resize
);
/* =========================================
   HEART EQUATION
========================================= */
function heart(a, scale) {
  const x =
    16 *
    Math.pow(Math.sin(a), 3) *
    scale;
  const y =
    (
      13 * Math.cos(a) -
      5 * Math.cos(2 * a) -
      2 * Math.cos(3 * a) -
      Math.cos(4 * a)
    ) * scale;
  return {
    x: x,
    y: -y
  };
}
/* =========================================
   CREATE PARTICLE
========================================= */
function createParticle() {
  const base =
    Math.min(
      window.innerWidth,
      window.innerHeight
    ) / 55;
  const a =
    Math.random() *
    Math.PI *
    2;
  /*
     Большинство частиц ближе
     к основной линии сердца.
  */
  const sc =
    (
      0.65 +
      Math.random() * 10.45
    ) *
    (base / 12);
  const pos =
    heart(a, sc);
  return {
    tx: pos.x,
    ty: pos.y,
    x: pos.x,
    y: pos.y,
    size:
      0.55 +
      Math.random() * 1.15,
    color:
      colors[
        Math.floor(
          Math.random() *
          colors.length
        )
      ],
    life: 1,
    decay:
      0.0018 +
      Math.random() * 0.0025,
    vx: 0,
    vy: 0
  };
}
/* =========================================
   INITIALIZE HEART
========================================= */
function initHeart() {
  particles = [];
  for (
    let i = 0;
    i < PARTICLE_COUNT;
    i++
  ) {
    particles.push(
      createParticle()
    );
  }
}
/* =========================================
   FREQUENCY RANGE
========================================= */
function getRange(minHz, maxHz) {
  if (!analyser) {
    return 0;
  }
  const nyquist =
    audioCtx.sampleRate / 2;
  const minBin =
    Math.max(
      0,
      Math.floor(
        minHz /
        nyquist *
        dataArray.length
      )
    );
  const maxBin =
    Math.min(
      dataArray.length - 1,
      Math.ceil(
        maxHz /
        nyquist *
        dataArray.length
      )
    );
  let sum = 0;
  let count = 0;
  for (
    let i = minBin;
    i <= maxBin;
    i++
  ) {
    sum += dataArray[i];
    count++;
  }
  if (count === 0) {
    return 0;
  }
  return sum / count / 255;
}
/* =========================================
   AUDIO ANALYSIS
========================================= */
function analyzeAudio() {
  analyser.getByteFrequencyData(
    dataArray
  );
  /*
     20–60 Hz
     Саббас.
  */
  const sub =
    getRange(20, 60);
  /*
     60–120 Hz
     Главная зона кика.
  */
  const kick =
    getRange(60, 120);
  /*
     120–200 Hz
     Тело кика.
  */
  const body =
    getRange(120, 200);
  /*
     Основная энергия удара.
     60–120 Hz имеет самый
     большой вес.
  */
  const kickEnergy =
      kick * 0.65 +
      sub * 0.20 +
      body * 0.15;
  /*
     Сглаженная энергия.
     Это нужно, чтобы сердце
     не дёргалось от каждого
     маленького FFT-скачка.
  */
  const smoothedKick =
    kickEnergy * 0.55 +
    previousKick * 0.45;
  /*
     Нас интересует именно
     РОСТ энергии.
     Постоянный бас не должен
     бесконечно считаться киком.
  */
  const attack =
    smoothedKick -
    previousKick;
  const now =
    performance.now();
  /*
     Детектор удара.
     120 мс — минимальное
     расстояние между ударами.
  */
  const isBeat =
    smoothedKick > 0.18 &&
    attack > 0.018 &&
    now - lastBeatTime > 120;
  if (isBeat) {
    /*
       Новый настоящий удар.
    */
    beat = 1;
    lastBeatTime = now;
  }
  /*
     Быстрое затухание удара.
     Получается:
     ТУК
      ↓
     быстрое возвращение
      ↓
     ТУК
  */
  beat *= 0.82;
  /*
     Общий бас.
     Используется гораздо
     мягче, чем кик.
  */
  bassMotion =
    bassMotion * 0.88 +
    (
      sub * 0.55 +
      kick * 0.45
    ) * 0.12;
  previousKick =
    smoothedKick;
  return {
    sub,
    kick,
    body,
    energy: smoothedKick
  };
}
/* =========================================
   DRAW HEART
========================================= */
function drawHeart(audioData) {
  const cx =
    window.innerWidth / 2;
  const cy =
    window.innerHeight / 2 - 10;
  /*
     Базовый размер.
     В обычном состоянии:
     1.0
  */
  heartbeatScale = 1;
  if (audioData) {
    /*
       Саб + постоянный бас
       дают очень небольшой
       живой пульс.
    */
    heartbeatScale +=
      bassMotion * 0.07;
    /*
       Сам удар.
       Сердце расширяется
       заметно, но не взрывается.
    */
    heartbeatScale +=
      beat * 0.17;
  }
  for (
    let i = particles.length - 1;
    i >= 0;
    i--
  ) {
    const p =
      particles[i];
    /*
       Целевая позиция.
       ВАЖНО:
       мы не разбрасываем частицы
       далеко от сердца.
       Поэтому форма сердца
       сохраняется.
    */
    const targetX =
      p.tx *
      heartbeatScale;
    const targetY =
      p.ty *
      heartbeatScale;
    /*
       Плавное притягивание
       к новой форме.
    */
    p.vx +=
      (targetX - p.x) *
      0.085;
    p.vy +=
      (targetY - p.y) *
      0.085;
    /*
       На самом ударе добавляем
       очень маленький импульс
       наружу.
       Это создаёт ощущение
       живого "тук".
    */
    if (beat > 0.45) {
      const distance =
        Math.sqrt(
          p.x * p.x +
          p.y * p.y
        ) || 1;
      const nx =
        p.x / distance;
      const ny =
        p.y / distance;
      const impulse =
        beat *
        0.55;
      p.vx +=
        nx * impulse;
      p.vy +=
        ny * impulse;
    }
    /*
       Движение.
    */
    p.x += p.vx;
    p.y += p.vy;
    /*
       Сопротивление.
       Частицы быстро успокаиваются.
    */
    p.vx *= 0.82;
    p.vy *= 0.82;
    /*
       Жизнь частицы.
    */
    p.life -=
      p.decay;
    if (p.life <= 0) {
      particles.splice(
        i,
        1
      );
      continue;
    }
    /*
       Размер частиц тоже
       немного реагирует
       на удар.
    */
    const particleSize =
      p.size *
      Math.max(
        p.life,
        0.35
      ) *
      (
        1 +
        beat * 0.20
      );
    ctx.beginPath();
    ctx.arc(
      cx + p.x,
      cy + p.y,
      particleSize,
      0,
      Math.PI * 2
    );
    ctx.fillStyle =
      p.color;
    ctx.globalAlpha =
      p.life * 0.9;
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  /*
     Если частицы закончились,
     восполняем их.
  */
  while (
    particles.length <
    PARTICLE_COUNT
  ) {
    particles.push(
      createParticle()
    );
  }
}
/* =========================================
   MAIN DRAW LOOP
========================================= */
function draw() {
  ctx.fillStyle =
    '#000';
  ctx.fillRect(
    0,
    0,
    window.innerWidth,
    window.innerHeight
  );
  let audioData = null;
  if (
    isPlaying &&
    analyser
  ) {
    audioData =
      analyzeAudio();
  }
  drawHeart(
    audioData
  );
  requestAnimationFrame(
    draw
  );
}
/* =========================================
   AUDIO INITIALIZATION
========================================= */
async function initAudio() {
  if (audioCtx) {
    return;
  }
  audioCtx =
    new (
      window.AudioContext ||
      window.webkitAudioContext
    )();
  const source =
    audioCtx.createMediaElementSource(
      audio
    );
  analyser =
    audioCtx.createAnalyser();
  /*
     2048 даёт достаточно
     хорошее разрешение для
     диапазона 20–200 Hz.
  */
  analyser.fftSize =
    2048;
  /*
     Маленькое сглаживание.
     Нам нужны быстрые атаки
     кика.
  */
  analyser.smoothingTimeConstant =
    0.12;
  dataArray =
    new Uint8Array(
      analyser.frequencyBinCount
    );
  source.connect(
    analyser
  );
  analyser.connect(
    audioCtx.destination
  );
}
/* =========================================
   PLAY / PAUSE
========================================= */
playBtn.addEventListener(
  'click',
  async () => {
    if (!isPlaying) {
      try {
        await initAudio();
        if (
          audioCtx.state ===
          'suspended'
        ) {
          await audioCtx.resume();
        }
        await audio.play();
        isPlaying = true;
        /*
           Сбрасываем состояние.
        */
        previousKick = 0;
        beat = 0;
        bassMotion = 0;
        heartbeatScale = 1;
        lastBeatTime = 0;
        initHeart();
        playBtn.textContent =
          '⏸ Пауза';
      } catch (error) {
        console.error(error);
        alert(
          'Ошибка аудио'
        );
      }
    } else {
      audio.pause();
      isPlaying = false;
      playBtn.textContent =
        '▶ Запустить';
    }
  }
);
/* =========================================
   START
========================================= */
initHeart();
requestAnimationFrame(
  draw
);
</script>
</body>
</html>
