<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Stars</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: #000000;
      overflow: hidden;
      touch-action: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #000000;
    }
    .back {
      position: fixed;
      top: 14px;
      left: 14px;
      color: #555;
      text-decoration: none;
      font-size: 14px;
      z-index: 10;
    }
    .controls {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
    }
    button {
      background: #000;
      border: 1px solid #333;
      color: #bbb;
      padding: 11px 24px;
      border-radius: 10px;
      font-size: 14px;
      min-width: 170px;
    }
  </style>
</head>
<body>
  <a href="index.html" class="back">← меню</a>
  <canvas id="canvas"></canvas>

  <div class="controls">
    <button id="playBtn">▶ Запустить</button>
  </div>

  <audio id="audio" src="white_tee.mp3" loop preload="auto" crossorigin="anonymous"></audio>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const audio = document.getElementById('audio');
    const playBtn = document.getElementById('playBtn');

    let stars = [];
    let isPlaying = false;
    let audioCtx, analyser, dataArray;
    let lastBass = 0;

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = window.innerWidth * dpr;
      canvas.height = window.innerHeight * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resize();
    window.addEventListener('resize', resize);

    function addStars(count, brightness = 0.5) {
      for (let i = 0; i < count; i++) {
        stars.push({
          x: Math.random() * window.innerWidth,
          y: Math.random() * window.innerHeight,
          size: 0.5 + Math.random() * 1.15,
          alpha: 0,
          targetAlpha: 0.25 + Math.random() * 0.55 * brightness,
          twinkleSpeed: 0.01 + Math.random() * 0.02,
          phase: Math.random() * Math.PI * 2,
          life: 1
        });
      }
    }

    function getBassEnergy() {
      if (!analyser) return 0;
      analyser.getByteFrequencyData(dataArray);

      let sum = 0;
      const bassBins = 8;
      for (let i = 0; i < bassBins; i++) {
        sum += dataArray[i];
      }
      return sum / bassBins / 255;
    }

    function draw(timestamp) {
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

      const time = timestamp * 0.001;

      // Анализ баса
      if (isPlaying && analyser) {
        const bass = getBassEnergy();

        // Сильный удар баса
        if (bass > 0.43 && bass - lastBass > 0.09) {
          const intensity = 1.1 + bass * 2.5;
          addStars(Math.floor(6 + intensity * 8), intensity);
        }
        // Средний уровень баса — редкое появление
        else if (bass > 0.30 && Math.random() < 0.22) {
          addStars(2 + Math.floor(bass * 4), 0.7);
        }

        lastBass = bass;
      }

      // Рисуем звёзды
      for (let i = stars.length - 1; i >= 0; i--) {
        const s = stars[i];

        // Плавное появление
        if (s.alpha < s.targetAlpha) {
          s.alpha += 0.018;
        }

        // Медленное затухание со временем
        s.life -= 0.0012;
        if (s.life <= 0) {
          stars.splice(i, 1);
          continue;
        }

        let a = s.alpha * s.life;
        const twinkle = Math.sin(time * s.twinkleSpeed * 45 + s.phase) * 0.22 + 0.78;
        a *= twinkle;

        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 255, 255, ${a})`;
        ctx.fill();
      }

      // Ограничение количества
      if (stars.length > 380) {
        stars.splice(0, stars.length - 380);
      }

      requestAnimationFrame(draw);
    }

    async function initAudio() {
      if (audioCtx) return;

      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const source = audioCtx.createMediaElementSource(audio);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 256;
      dataArray = new Uint8Array(analyser.frequencyBinCount);

      source.connect(analyser);
      analyser.connect(audioCtx.destination);
    }

    playBtn.addEventListener('click', async () => {
      if (!isPlaying) {
        try {
          await initAudio();
          if (audioCtx.state === 'suspended') {
            await audioCtx.resume();
          }
          await audio.play();
          isPlaying = true;
          stars = [];                 // начинаем с пустого неба
          playBtn.textContent = '⏸ Пауза';
        } catch (e) {
          alert('Не удалось запустить аудио');
          console.error(e);
        }
      } else {
        audio.pause();
        isPlaying = false;
        playBtn.textContent = '▶ Запустить';
      }
    });

    requestAnimationFrame(draw);
  </script>
</body>
</html>
