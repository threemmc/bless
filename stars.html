<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Stars — White Tee</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: #000000;
      overflow: hidden;
      touch-action: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #000000;
    }
    .back {
      position: fixed;
      top: 16px;
      left: 16px;
      color: rgba(255, 255, 255, 0.35);
      text-decoration: none;
      font-size: 15px;
      z-index: 10;
      padding: 6px 10px;
    }
    .controls {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
    }
    button {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ddd;
      padding: 12px 26px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 15px;
      min-width: 200px;
    }
  </style>
</head>
<body>
  <a href="index.html" class="back">← меню</a>
  <canvas id="canvas"></canvas>

  <div class="controls">
    <button id="playBtn">▶ Запустить</button>
  </div>

  <audio id="audio" src="white_tee.mp3" loop preload="auto"></audio>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const audio = document.getElementById('audio');
    const playBtn = document.getElementById('playBtn');

    let stars = [];
    let isPlaying = false;
    let lastBeat = 0;
    let startTime = 0;

    const BPM = 150;
    const BEAT_MS = 60000 / BPM;

    function resize() {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = window.innerWidth * dpr;
      canvas.height = window.innerHeight * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resize();
    window.addEventListener('resize', resize);

    function createStars(count = 220) {
      stars = [];
      for (let i = 0; i < count; i++) {
        stars.push({
          x: Math.random() * window.innerWidth,
          y: Math.random() * window.innerHeight,
          size: 0.6 + Math.random() * 1.3,      // маленькие точки
          baseAlpha: 0.25 + Math.random() * 0.55,
          twinkleSpeed: 0.008 + Math.random() * 0.02,
          phase: Math.random() * Math.PI * 2
        });
      }
    }
    createStars();

    function draw(timestamp) {
      // Абсолютно чёрный фон каждый кадр
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

      const time = timestamp * 0.001;

      for (const s of stars) {
        let alpha = s.baseAlpha;

        if (isPlaying) {
          // Лёгкое мерцание
          const twinkle = Math.sin(time * s.twinkleSpeed * 50 + s.phase) * 0.3 + 0.7;
          alpha *= twinkle;
        } else {
          alpha *= 0.45;
        }

        // Только чистая точка, без какого-либо свечения
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
        ctx.fill();
      }

      // Ритм
      if (isPlaying) {
        const elapsed = timestamp - startTime;
        if (elapsed - lastBeat >= BEAT_MS) {
          lastBeat = elapsed;

          // На бит некоторые звёзды становятся чуть ярче
          for (let i = 0; i < 18; i++) {
            const s = stars[Math.floor(Math.random() * stars.length)];
            s.baseAlpha = Math.min(0.95, s.baseAlpha + 0.35);
          }
        }

        // Плавно возвращаем яркость
        for (const s of stars) {
          s.baseAlpha += (0.35 - s.baseAlpha) * 0.025;
        }
      }

      requestAnimationFrame(draw);
    }

    playBtn.addEventListener('click', async () => {
      if (!isPlaying) {
        try {
          await audio.play();
          isPlaying = true;
          startTime = performance.now();
          lastBeat = 0;
          playBtn.textContent = '⏸ Пауза';
        } catch (e) {
          alert('Не удалось запустить аудио.\nПроверьте файл white_tee.mp3');
        }
      } else {
        audio.pause();
        isPlaying = false;
        playBtn.textContent = '▶ Запустить';
      }
    });

    // Пересоздаём звёзды при изменении размера экрана
    window.addEventListener('resize', () => {
      createStars();
    });

    requestAnimationFrame(draw);
  </script>
</body>
</html>
