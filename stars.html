<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Stars</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: #000000;
      overflow: hidden;
      touch-action: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #000000;
    }
    .back {
      position: fixed;
      top: 14px;
      left: 14px;
      color: #555;
      text-decoration: none;
      font-size: 14px;
      z-index: 10;
    }
    .controls {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
    }
    button {
      background: #000000;
      border: 1px solid #333;
      color: #bbb;
      padding: 11px 24px;
      border-radius: 10px;
      font-size: 14px;
      min-width: 170px;
    }
  </style>
</head>
<body>
  <a href="index.html" class="back">← меню</a>
  <canvas id="canvas"></canvas>

  <div class="controls">
    <button id="playBtn">▶ Запустить</button>
  </div>

  <audio id="audio" src="white_tee.mp3" loop preload="auto" crossorigin="anonymous"></audio>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const audio = document.getElementById('audio');
    const playBtn = document.getElementById('playBtn');

    let stars = [];
    let isPlaying = false;
    let audioCtx, analyser, dataArray;
    let lastSpawn = 0;

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = window.innerWidth * dpr;
      canvas.height = window.innerHeight * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resize();
    window.addEventListener('resize', resize);

    function addStars(count) {
      for (let i = 0; i < count; i++) {
        stars.push({
          x: Math.random() * window.innerWidth,
          y: Math.random() * window.innerHeight,
          size: 0.5 + Math.random() * 1.2,
          alpha: 0,
          target: 0.25 + Math.random() * 0.5,
          speed: 0.006 + Math.random() * 0.015,
          phase: Math.random() * Math.PI * 2,
          life: 1
        });
      }
    }

    function getBass() {
      analyser.getByteFrequencyData(dataArray);
      let sum = 0;
      for (let i = 0; i < 12; i++) sum += dataArray[i];
      return sum / 12 / 255;
    }

    function draw(t) {
      // Полностью чёрный фон каждый кадр
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

      const time = t * 0.001;

      if (isPlaying && analyser) {
        const bass = getBass();
        const now = performance.now();

        if (bass > 0.40 && now - lastSpawn > 280) {
          addStars(2 + Math.floor(bass * 4));
          lastSpawn = now;
        } else if (bass > 0.28 && now - lastSpawn > 600) {
          addStars(1);
          lastSpawn = now;
        }
      }

      for (let i = stars.length - 1; i >= 0; i--) {
        const s = stars[i];
        if (s.alpha < s.target) s.alpha += 0.012;
        s.life -= 0.0009;

        if (s.life <= 0) {
          stars.splice(i, 1);
          continue;
        }

        const tw = Math.sin(time * s.speed * 40 + s.phase) * 0.18 + 0.82;
        const a = s.alpha * s.life * tw;

        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255,255,255,${a})`;
        ctx.fill();
      }

      if (stars.length > 280) stars.splice(0, stars.length - 280);
      requestAnimationFrame(draw);
    }

    async function initAudio() {
      if (audioCtx) return;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const source = audioCtx.createMediaElementSource(audio);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 512;
      analyser.smoothingTimeConstant = 0.4;
      dataArray = new Uint8Array(analyser.frequencyBinCount);
      source.connect(analyser);
      analyser.connect(audioCtx.destination);
    }

    playBtn.addEventListener('click', async () => {
      if (!isPlaying) {
        try {
          await initAudio();
          if (audioCtx.state === 'suspended') await audioCtx.resume();
          await audio.play();
          isPlaying = true;
          stars = [];
          playBtn.textContent = '⏸ Пауза';
        } catch (e) {
          alert('Ошибка аудио');
        }
      } else {
        audio.pause();
        isPlaying = false;
        playBtn.textContent = '▶ Запустить';
      }
    });

    requestAnimationFrame(draw);
  </script>
</body>
</html>
