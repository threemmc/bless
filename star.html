<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stars — White Tee</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    canvas { display: block; }
    .back {
      position: fixed;
      top: 20px;
      left: 20px;
      color: rgba(255,255,255,0.4);
      text-decoration: none;
      font-size: 14px;
      z-index: 10;
      transition: color 0.2s;
    }
    .back:hover { color: #ff9ec0; }
    .controls {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
    }
    button {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ddd;
      padding: 11px 22px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      backdrop-filter: blur(6px);
    }
    button:hover { background: rgba(255, 255, 255, 0.15); }
  </style>
</head>
<body>
  <a href="index.html" class="back">← меню</a>
  <canvas id="canvas"></canvas>

  <div class="controls">
    <button id="playBtn">▶ Запустить музыку + анимацию</button>
  </div>

  <audio id="audio" src="white_tee.mp3" loop preload="auto"></audio>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const audio = document.getElementById('audio');
    const playBtn = document.getElementById('playBtn');

    let stars = [];
    let isPlaying = false;
    let lastBeat = 0;
    let startTime = 0;
    let flash = 0;

    const BPM = 150;
    const BEAT_MS = 60000 / BPM;

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    function createStars(count = 180) {
      stars = [];
      for (let i = 0; i < count; i++) {
        stars.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          size: Math.random() * 1.8 + 0.4,
          baseAlpha: Math.random() * 0.6 + 0.2,
          twinkleSpeed: Math.random() * 0.02 + 0.005,
          phase: Math.random() * Math.PI * 2
        });
      }
    }
    createStars();

    function draw(timestamp) {
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // лёгкая вспышка на сильный бит
      if (flash > 0) {
        ctx.fillStyle = `rgba(255, 220, 255, ${flash * 0.07})`;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        flash *= 0.9;
      }

      const time = timestamp * 0.001;

      for (const s of stars) {
        const twinkle = Math.sin(time * s.twinkleSpeed * 60 + s.phase) * 0.35 + 0.65;
        const alpha = s.baseAlpha * twinkle * (isPlaying ? 1 : 0.5);

        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
        ctx.fill();

        // мягкое свечение
        if (s.size > 1.2) {
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.size * 3, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255, 230, 255, ${alpha * 0.12})`;
          ctx.fill();
        }
      }

      if (isPlaying) {
        const elapsed = timestamp - startTime;
        if (elapsed - lastBeat >= BEAT_MS) {
          lastBeat = elapsed;
          // лёгкий «толчок» — некоторые звёзды становятся ярче
          for (let i = 0; i < 12; i++) {
            const s = stars[Math.floor(Math.random() * stars.length)];
            s.baseAlpha = Math.min(1, s.baseAlpha + 0.4);
          }
          if (Math.floor(elapsed / BEAT_MS) % 4 === 0) {
            flash = 1;
          }
        }

        // постепенно возвращаем яркость
        for (const s of stars) {
          s.baseAlpha += (0.4 - s.baseAlpha) * 0.02;
        }
      }

      requestAnimationFrame(draw);
    }

    playBtn.addEventListener('click', async () => {
      if (!isPlaying) {
        try {
          await audio.play();
          isPlaying = true;
          startTime = performance.now();
          lastBeat = 0;
          playBtn.textContent = '⏸ Пауза';
        } catch (e) {
          alert('Не удалось запустить аудио. Проверьте файл white_tee.mp3');
        }
      } else {
        audio.pause();
        isPlaying = false;
        playBtn.textContent = '▶ Продолжить';
      }
    });

    requestAnimationFrame(draw);
  </script>
</body>
</html>
