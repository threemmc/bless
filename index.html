<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>bless</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: #000000;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    h1 {
      font-size: clamp(2.4rem, 7vw, 3.6rem);
      font-weight: 300;
      letter-spacing: 0.18em;
      margin-bottom: 0.35em;
      color: #ff8fb8;
    }

    .subtitle {
      color: #777;
      font-size: 0.95rem;
      margin-bottom: 3.2rem;
      letter-spacing: 0.06em;
    }

    .options {
      display: flex;
      gap: 1.6rem;
      flex-wrap: wrap;
      justify-content: center;
      padding: 0 1.2rem;
    }

    .card {
      width: 240px;
      height: 290px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: #fff;
      transition: all 0.3s ease;
    }

    .card:hover {
      border-color: rgba(255, 140, 180, 0.45);
      background: rgba(255, 255, 255, 0.05);
      transform: translateY(-6px);
    }

    .icon {
      font-size: 3.2rem;
      margin-bottom: 1.1rem;
      color: #ff8fb8;
    }

    .card h2 {
      font-size: 1.2rem;
      font-weight: 500;
      margin-bottom: 0.5rem;
      letter-spacing: 0.04em;
    }

    .card p {
      font-size: 0.82rem;
      color: #888;
      text-align: center;
      padding: 0 1.4rem;
      line-height: 1.4;
    }

    footer {
      position: fixed;
      bottom: 22px;
      color: #444;
      font-size: 0.78rem;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>
  <h1>bless</h1>
  <p class="subtitle">выбери атмосферу</p>

  <div class="options">
    <a href="heart.html" class="card">
      <div class="icon">♡</div>
      <h2>Heart</h2>
      <p>Ритмичное сердце под White Tee</p>
    </a>

    <a href="stars.html" class="card">
      <div class="icon">✦</div>
      <h2>Stars</h2>
      <p>Звёздное небо под тот же трек</p>
    </a>
  </div>

  <footer>Lil Peep — White Tee</footer>
</body>
</html>
