<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>bless</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: #000000;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 16px;
    }

    .subtitle {
      color: #666;
      font-size: 0.9rem;
      margin-bottom: 2.4rem;
      letter-spacing: 0.05em;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
      max-width: 280px;
    }

    .card {
      background: #000;
      border: 1px solid #222;
      border-radius: 14px;
      padding: 28px 20px;
      text-align: center;
      text-decoration: none;
      color: #fff;
      transition: border-color 0.2s;
    }

    .card:active {
      border-color: #ff8fb8;
    }

    .icon {
      font-size: 2.4rem;
      margin-bottom: 10px;
      color: #ff8fb8;
    }

    .card h2 {
      font-size: 1.1rem;
      font-weight: 500;
      margin-bottom: 6px;
    }

    .card p {
      font-size: 0.78rem;
      color: #777;
      line-height: 1.35;
    }

    footer {
      position: fixed;
      bottom: 18px;
      color: #333;
      font-size: 0.72rem;
    }
  </style>
</head>
<body>
  <p class="subtitle">выбери атмосферу</p>

  <div class="options">
    <a href="heart.html" class="card">
      <div class="icon">♡</div>
      <h2>Heart</h2>
      <p>Ритмичное сердце под White Tee</p>
    </a>

    <a href="stars.html" class="card">
      <div class="icon">✦</div>
      <h2>Stars</h2>
      <p>Звёздное небо под тот же трек</p>
    </a>
  </div>

  <footer>Lil Peep — White Tee</footer>
</body>
</html>
