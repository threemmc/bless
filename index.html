<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>bless</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #050505;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .bg {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, #1a0a12 0%, #050505 70%);
      z-index: -1;
    }

    h1 {
      font-size: clamp(2.2rem, 6vw, 3.8rem);
      font-weight: 300;
      letter-spacing: 0.15em;
      margin-bottom: 0.4em;
      color: #ff8fb8;
      text-shadow: 0 0 40px rgba(255, 100, 160, 0.4);
    }

    .subtitle {
      color: #aaa;
      font-size: 0.95rem;
      margin-bottom: 3.5rem;
      letter-spacing: 0.05em;
    }

    .options {
      display: flex;
      gap: 2rem;
      flex-wrap: wrap;
      justify-content: center;
      padding: 0 1.5rem;
    }

    .card {
      width: 260px;
      height: 320px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 140, 180, 0.25);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: #fff;
      transition: all 0.35s ease;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 30%, rgba(255, 100, 160, 0.15), transparent 70%);
      opacity: 0;
      transition: opacity 0.35s;
    }

    .card:hover {
      transform: translateY(-8px);
      border-color: rgba(255, 140, 180, 0.6);
      box-shadow: 0 20px 40px rgba(255, 80, 140, 0.15);
    }

    .card:hover::before { opacity: 1; }

    .icon {
      font-size: 3.5rem;
      margin-bottom: 1.2rem;
      filter: drop-shadow(0 0 12px rgba(255, 120, 180, 0.5));
    }

    .card h2 {
      font-size: 1.25rem;
      font-weight: 500;
      margin-bottom: 0.6rem;
      letter-spacing: 0.04em;
    }

    .card p {
      font-size: 0.85rem;
      color: #999;
      text-align: center;
      padding: 0 1.5rem;
      line-height: 1.4;
    }

    footer {
      position: fixed;
      bottom: 24px;
      color: #555;
      font-size: 0.8rem;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>
  <div class="bg"></div>

  <h1>bless</h1>
  <p class="subtitle">выбери атмосферу</p>

  <div class="options">
    <a href="heart.html" class="card">
      <div class="icon">♡</div>
      <h2>Heart</h2>
      <p>Ритмичное сердце под White Tee</p>
    </a>

    <a href="stars.html" class="card">
      <div class="icon">✦</div>
      <h2>Stars</h2>
      <p>Звёздное небо под тот же трек</p>
    </a>
  </div>

  <footer>Lil Peep — White Tee</footer>
</body>
</html>
