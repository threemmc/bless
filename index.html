<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>White Tee Heart</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: system-ui, sans-serif;
    }
    canvas { display: block; background: #000; }
    .controls {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
    }
    button {
      background: rgba(255, 80, 140, 0.3);
      border: 1px solid rgba(255, 120, 180, 0.6);
      color: #ff9ec0;
      padding: 12px 24px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 15px;
      backdrop-filter: blur(8px);
    }
    button:hover { background: rgba(255, 80, 140, 0.5); }
    #status {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      color: #ff9ec0;
      font-size: 13px;
      background: rgba(0,0,0,0.6);
      padding: 6px 12px;
      border-radius: 6px;
      display: none;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="status"></div>

  <div class="controls">
    <button id="playBtn">▶ Запустить музыку + анимацию</button>
  </div>

  <audio id="audio" loop preload="auto"></audio>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const audio = document.getElementById('audio');
    const playBtn = document.getElementById('playBtn');
    const status = document.getElementById('status');

    // Пробуем несколько возможных путей
    const possibleSources = [
      'white_tee.mp3',
      './white_tee.mp3',
      'white%20tee.mp3',
      './white%20tee.mp3',
      'white tee.mp3'
    ];

    let currentSrcIndex = 0;
    let particles = [];
    let scalePulse = 1;
    let lastBeat = 0;
    let isPlaying = false;
    let startTime = 0;

    const BPM = 150;
    const BEAT_MS = 60000 / BPM;

    function resize() {
      canvas.width = Math.min(720, window.innerWidth);
      canvas.height = Math.min(720, window.innerHeight);
    }
    resize();
    window.addEventListener('resize', resize);

    function heart(a, scale) {
      const x = 16 * Math.pow(Math.sin(a), 3) * scale;
      const y = (13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a)) * scale;
      return { x, y: -y };
    }

    function spawnBurst(intensity = 1) {
      const count = Math.floor(70 + Math.random() * 50) * intensity;
      for (let i = 0; i < count; i++) {
        const a = Math.random() * Math.PI * 2;
        const sc = (0.6 + Math.random() * 14) * scalePulse;
        const pos = heart(a, sc);
        const ang = Math.atan2(pos.y, pos.x) + (Math.random() - 0.5) * 0.9;
        const length = (5 + Math.random() * 16) * (0.7 + Math.random() * 0.5);

        particles.push({
          x: pos.x + (Math.random() - 0.5) * 3,
          y: pos.y + (Math.random() - 0.5) * 3,
          ang, length,
          life: 1,
          decay: 0.004 + Math.random() * 0.006,
          color: `hsla(${320 + Math.random() * 30}, 90%, ${55 + Math.random() * 20}%, 0.9)`,
          width: 0.5 + Math.random() * 1.1
        });
      }
    }

    function draw(timestamp) {
      if (!isPlaying) {
        requestAnimationFrame(draw);
        return;
      }

      ctx.fillStyle = 'rgba(0, 0, 0, 0.18)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const cx = canvas.width / 2;
      const cy = canvas.height / 2;

      const elapsed = timestamp - startTime;
      if (elapsed - lastBeat >= BEAT_MS) {
        lastBeat = elapsed;
        scalePulse = 1.12;
        spawnBurst(1.0);
        if (Math.floor(elapsed / BEAT_MS) % 4 === 0) {
          spawnBurst(1.35);
          scalePulse = 1.22;
        }
      }
      scalePulse += (1 - scalePulse) * 0.08;

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.life -= p.decay;
        if (p.life <= 0) {
          particles.splice(i, 1);
          continue;
        }
        ctx.beginPath();
        ctx.strokeStyle = p.color.replace('0.9', (p.life * 0.9).toFixed(2));
        ctx.lineWidth = p.width * p.life;
        ctx.lineCap = 'round';
        ctx.moveTo(cx + p.x, cy + p.y);
        ctx.lineTo(
          cx + p.x + p.length * Math.cos(p.ang) * p.life,
          cy + p.y + p.length * Math.sin(p.ang) * p.life
        );
        ctx.stroke();
      }

      if (particles.length > 4500) particles.splice(0, particles.length - 4500);
      requestAnimationFrame(draw);
    }

    function tryNextSource() {
      if (currentSrcIndex >= possibleSources.length) {
        status.style.display = 'block';
        status.textContent = 'Не удалось найти mp3-файл. Переименуйте его в white_tee.mp3';
        return;
      }
      audio.src = possibleSources[currentSrcIndex];
      currentSrcIndex++;
      audio.load();
    }

    playBtn.addEventListener('click', async () => {
      if (isPlaying) {
        audio.pause();
        isPlaying = false;
        playBtn.textContent = '▶ Продолжить';
        return;
      }

      status.style.display = 'block';
      status.textContent = 'Пробуем загрузить музыку...';

      // Пробуем источники по очереди
      currentSrcIndex = 0;
      tryNextSource();

      audio.oncanplaythrough = async () => {
        try {
          await audio.play();
          isPlaying = true;
          startTime = performance.now();
          lastBeat = 0;
          particles = [];
          spawnBurst(1.6);
          playBtn.textContent = '⏸ Пауза';
          status.style.display = 'none';
        } catch (err) {
          status.textContent = 'Ошибка воспроизведения: ' + err.message;
        }
      };

      audio.onerror = () => {
        tryNextSource();
      };
    });

    requestAnimationFrame(draw);
  </script>
</body>
</html>
